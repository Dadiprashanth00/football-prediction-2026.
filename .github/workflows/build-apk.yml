name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Download real fixtures and results
        run: node scripts/fetch-data.mjs || echo "fetch failed, using committed data.json"

      - name: Copy the web app into the APK
        run: |
          cp web/index.html android/app/src/main/assets/www/index.html
          if [ -f web/data.json ]; then cp web/data.json android/app/src/main/assets/www/data.json; fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace > build.log 2>&1
          code=$?
          tail -60 build.log
          if [ $code -ne 0 ]; then
            grep -nE "error:|e: |FAILURE|What went wrong|Could not|failed|Exception|AAPT|resource" build.log | grep -v "^.*at " | head -40 | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit $code
          fi
          cp app/build/outputs/apk/debug/app-debug.apk ../FootballPrediction2026.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FootballPrediction2026-apk
          path: FootballPrediction2026.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Football Prediction 2026 – build ${{ github.run_number }}
          body: Tap FootballPrediction2026.apk below to download and install on Android.
          files: FootballPrediction2026.apk
          make_latest: true

      - name: Publish website (GitHub Pages)
        run: |
          mkdir site && cp web/index.html site/ && touch site/.nojekyll
          if [ -f web/data.json ]; then cp web/data.json site/; fi
          cd site && git init -q -b gh-pages
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Update website"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
